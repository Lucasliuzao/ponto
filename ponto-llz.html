<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Ponto LLZ">
<meta name="theme-color" content="#ffffff">
<title>Ponto LLZ</title>
<style>
  :root {
    --bg: #f5f5f3;
    --card: #ffffff;
    --border: rgba(0,0,0,0.09);
    --text: #1a1a18;
    --muted: #6b6b67;
    --accent: #1a56db;
    --accent-bg: #eff4ff;
    --accent-text: #1e429f;
    --success-bg: #f0fdf4;
    --success-text: #166534;
    --warn-bg: #fffbeb;
    --warn-text: #92400e;
    --danger-bg: #fff1f2;
    --danger-text: #9f1239;
    --radius: 14px;
    --radius-sm: 8px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #121212;
      --card: #1e1e1e;
      --border: rgba(255,255,255,0.09);
      --text: #f0f0ee;
      --muted: #9a9a96;
      --accent: #4f83f7;
      --accent-bg: #1a2540;
      --accent-text: #93b4f9;
      --success-bg: #0f2818;
      --success-text: #86efac;
      --warn-bg: #2a1f08;
      --warn-text: #fcd34d;
      --danger-bg: #2a0f14;
      --danger-text: #fca5a5;
    }
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100dvh;
    padding: env(safe-area-inset-top, 12px) 16px env(safe-area-inset-bottom, 24px);
    max-width: 480px;
    margin: 0 auto;
  }
  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 20px 0 16px;
  }
  header h1 { font-size: 20px; font-weight: 600; letter-spacing: -0.3px; }
  header span { font-size: 12px; color: var(--muted); background: var(--card); border: 0.5px solid var(--border); border-radius: 99px; padding: 3px 10px; }
  .card {
    background: var(--card);
    border: 0.5px solid var(--border);
    border-radius: var(--radius);
    padding: 16px;
    margin-bottom: 12px;
  }
  .card-label {
    font-size: 11px;
    font-weight: 600;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.07em;
    margin-bottom: 12px;
  }
  .field { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
  .field:last-child { margin-bottom: 0; }
  .field label { font-size: 15px; color: var(--text); }
  .field input[type=time] {
    font-size: 22px;
    font-weight: 500;
    color: var(--accent);
    background: var(--accent-bg);
    border: none;
    border-radius: var(--radius-sm);
    padding: 6px 10px;
    outline: none;
    width: 130px;
    text-align: center;
    -webkit-appearance: none;
  }
  .result-hero {
    background: var(--accent-bg);
    border: 0.5px solid var(--border);
    border-radius: var(--radius);
    padding: 20px 16px;
    text-align: center;
    margin-bottom: 12px;
  }
  .result-hero .rlabel { font-size: 13px; color: var(--accent-text); margin-bottom: 6px; }
  .result-hero .rval { font-size: 52px; font-weight: 700; color: var(--accent); letter-spacing: -2px; line-height: 1; }
  .result-hero .rsub { font-size: 13px; color: var(--accent-text); margin-top: 6px; }
  .metrics { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 12px; }
  .metric { background: var(--card); border: 0.5px solid var(--border); border-radius: var(--radius-sm); padding: 12px; }
  .metric .ml { font-size: 11px; color: var(--muted); margin-bottom: 4px; }
  .metric .mv { font-size: 20px; font-weight: 600; color: var(--text); }
  .metric.ok { background: var(--success-bg); }
  .metric.ok .mv { color: var(--success-text); }
  .metric.warn { background: var(--warn-bg); }
  .metric.warn .mv { color: var(--warn-text); }
  .detail-row {
    display: flex; justify-content: space-between; align-items: center;
    font-size: 14px; padding: 9px 0;
    border-bottom: 0.5px solid var(--border);
  }
  .detail-row:last-child { border-bottom: none; }
  .detail-row .dl { color: var(--muted); }
  .detail-row .dv { font-weight: 500; }
  .detail-row.strong .dv { color: var(--accent); font-size: 16px; }
  .reset-btn {
    width: 100%;
    padding: 14px;
    border: 0.5px solid var(--border);
    border-radius: var(--radius);
    background: var(--card);
    color: var(--muted);
    font-size: 14px;
    cursor: pointer;
    margin-top: 4px;
  }
  .error {
    background: var(--danger-bg);
    color: var(--danger-text);
    border-radius: var(--radius-sm);
    padding: 10px 14px;
    font-size: 13px;
    margin-bottom: 12px;
    display: none;
  }
  .hint {
    font-size: 12px;
    color: var(--muted);
    text-align: center;
    padding: 16px 0 8px;
    display: none;
  }
</style>
</head>
<body>

<header>
  <h1>⏱ Ponto LLZ</h1>
  <span>8h48 / dia</span>
</header>

<div class="card">
  <div class="card-label">Entrada</div>
  <div class="field">
    <label>Chegada</label>
    <input type="time" id="entrada" value="08:12" oninput="calcular()">
  </div>
</div>

<div class="card">
  <div class="card-label">Almoço</div>
  <div class="field">
    <label>Saída almoço</label>
    <input type="time" id="a1" value="12:00" oninput="calcular()">
  </div>
  <div class="field">
    <label>Retorno</label>
    <input type="time" id="a2" value="13:00" oninput="calcular()">
  </div>
</div>

<div id="erro" class="error"></div>

<div id="resultado" style="display:none">
  <div class="result-hero">
    <div class="rlabel">Bater saída às</div>
    <div class="rval" id="saida">—</div>
    <div class="rsub" id="saida-sub">—</div>
  </div>

  <div class="metrics">
    <div class="metric">
      <div class="ml">Manhã</div>
      <div class="mv" id="m-manha">—</div>
    </div>
    <div class="metric" id="card-almoco">
      <div class="ml">Almoço</div>
      <div class="mv" id="m-almoco">—</div>
    </div>
    <div class="metric">
      <div class="ml">Tarde necessária</div>
      <div class="mv" id="m-tarde">—</div>
    </div>
    <div class="metric">
      <div class="ml">Total</div>
      <div class="mv">8h48</div>
    </div>
  </div>

  <div class="card">
    <div class="card-label">Resumo</div>
    <div class="detail-row"><span class="dl">Entrada</span><span class="dv" id="d-entrada">—</span></div>
    <div class="detail-row"><span class="dl">Saída almoço</span><span class="dv" id="d-a1">—</span></div>
    <div class="detail-row"><span class="dl">Retorno almoço</span><span class="dv" id="d-a2">—</span></div>
    <div class="detail-row strong"><span class="dl">Saída prevista</span><span class="dv" id="d-saida">—</span></div>
  </div>
</div>

<p class="hint" id="hint-ios">💡 Para adicionar à tela inicial: toque em <strong>Compartilhar</strong> → <strong>Adicionar à Tela de Início</strong></p>

<button class="reset-btn" onclick="resetPadrao()">↺ Restaurar horário padrão</button>

<script>
const JORNADA = 8 * 60 + 48;

function toMin(t) { const [h,m] = t.split(':').map(Number); return h*60+m; }
function toHHMM(n) { return String(Math.floor(n/60)).padStart(2,'0')+':'+String(n%60).padStart(2,'0'); }
function fmt(m) {
  if (m < 0) return '—';
  const h = Math.floor(m/60), min = m%60;
  return h === 0 ? min+'min' : h+'h'+(min>0?String(min).padStart(2,'0'):'');
}

function calcular() {
  const eStr = document.getElementById('entrada').value;
  const a1Str = document.getElementById('a1').value;
  const a2Str = document.getElementById('a2').value;
  if (!eStr||!a1Str||!a2Str) return;

  const e=toMin(eStr), a1=toMin(a1Str), a2=toMin(a2Str);
  const erro = document.getElementById('erro');

  if (a1<=e) { erro.textContent='Saída do almoço deve ser depois da entrada.'; erro.style.display='block'; document.getElementById('resultado').style.display='none'; return; }
  if (a2<=a1) { erro.textContent='Retorno do almoço deve ser depois da saída.'; erro.style.display='block'; document.getElementById('resultado').style.display='none'; return; }
  erro.style.display='none';

  const manha = a1-e;
  const almoco = a2-a1;
  const tarde = JORNADA-manha;
  const saida = a2+tarde;

  document.getElementById('saida').textContent = toHHMM(saida);
  document.getElementById('saida-sub').textContent = 'após '+fmt(tarde)+' de tarde';
  document.getElementById('m-manha').textContent = fmt(manha);
  document.getElementById('m-almoco').textContent = fmt(almoco);
  document.getElementById('m-tarde').textContent = fmt(tarde);
  document.getElementById('d-entrada').textContent = eStr;
  document.getElementById('d-a1').textContent = a1Str;
  document.getElementById('d-a2').textContent = a2Str;
  document.getElementById('d-saida').textContent = toHHMM(saida);

  const ca = document.getElementById('card-almoco');
  ca.className = 'metric ' + (almoco < 60 ? 'warn' : 'ok');

  document.getElementById('resultado').style.display = 'block';
}

function resetPadrao() {
  document.getElementById('entrada').value='08:12';
  document.getElementById('a1').value='12:00';
  document.getElementById('a2').value='13:00';
  calcular();
}

const isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent) && !window.navigator.standalone;
if (isIOS) document.getElementById('hint-ios').style.display='block';

calcular();
</script>
</body>
</html>
